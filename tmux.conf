# act like vim
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind v split-window -h
bind s split-window -v

# reload the config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# windows start at 1
set -g base-index 1
set -g mouse on

# look good, and tell tmux this terminal supports OSC 52 (Ms) so
# set-clipboard below can actually reach the real clipboard
set -g terminal-overrides ',xterm-256color:Tc:Ms=\E]52;c;%p2%s\007'

# copy mouse/vi selections straight to the real clipboard, not just
# tmux's internal paste buffer (no pbcopy/xclip in this container, so
# OSC 52 is what makes this work over kubectl attach/exec)
set -g set-clipboard on

# double-click a word (e.g. a pod IP) to select AND copy it in one
# action, instead of just selecting and needing a second step
bind -n                DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-selection-and-cancel
bind -T copy-mode      DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi   DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-selection-and-cancel

# resize the current pane with the arrow keys: press the prefix once,
# then keep tapping an arrow -- no need to repeat the prefix each time
# (h/j/k/l above already switch panes, so the arrow keys were unused)
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5

# give the resize taps above a more forgiving repeat window than the
# 500ms default -- easier to keep going without re-pressing the prefix
set -g repeat-time 1000
