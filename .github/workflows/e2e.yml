name: e2e

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: podium:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: podium

      - name: Load image into kind
        run: kind load docker-image podium:ci --name podium

      - name: Deploy podium with broadcast enabled
        run: |
          # rbac.cluster.clusterRoles matches what `make presenter` actually
          # sets (see the Makefile) - the chart's own default RBAC (a
          # namespace-scoped view role) is leaner than any real deployment
          # of this image, and kubectl-mcp-server's own cluster-wide checks
          # below need the real permission shape to mean anything.
          helm upgrade --install podium helm/podium \
            --set image.repository=podium \
            --set image.tag=ci \
            --set image.pullPolicy=IfNotPresent \
            --set broadcast.enabled=true \
            --set rbac.cluster.clusterRoles={cluster-admin} \
            --wait --timeout=90s

      - name: Verify kubectl works from inside the pod as the k8s user
        run: |
          # Exercises the actual shipped .zshrc kubeconfig bootstrap, not a
          # hand-copied duplicate of it - this is what "login -f -p k8s"
          # ultimately relies on. sudo strips KUBERNETES_SERVICE_HOST/PORT
          # deliberately, so a pass here proves the file-based kubeconfig
          # works on its own, without depending on login preserving env.
          out=$(kubectl exec deploy/podium -c podium -- sudo -u k8s -H zsh -ic 'kubectl get pods' 2>&1)
          echo "$out"
          echo "$out" | grep -q "^NAME" || {
            echo "kubectl inside the pod did not return a pod list"
            exit 1
          }

      - name: Verify kubectl-mcp-server works from inside the pod
        run: |
          # doctor checks kubectl/helm/the in-cluster kubeconfig/fastmcp are
          # all present and working together - a broken install (see the
          # Dockerfile's fastmcp<4 pin, needed because kubectl-mcp-server's
          # own dependency pin has no upper bound) fails here loudly instead
          # of silently later.
          out=$(kubectl exec deploy/podium -c podium -- sudo -u k8s -H sh -c 'kubectl-mcp-serve doctor' 2>&1)
          echo "$out"
          if ! echo "$out" | grep -q "All checks passed"; then
            echo "kubectl-mcp-server doctor reported a failed dependency check"
            exit 1
          fi

          # Real functional calls against a real workload, not just that the
          # binary starts: a read against a healthy pod, a read against one
          # that failed to start, a write that changes cluster state, and a
          # schema lookup - the tool's main capability classes, all through
          # podium's own in-cluster credentials, the same as an AI client
          # would use live.
          kubectl create deployment mcp-e2e-app --image=nginx:alpine --replicas=1
          kubectl wait --for=condition=available --timeout=60s deployment/mcp-e2e-app

          out=$(kubectl exec deploy/podium -c podium -- sudo -u k8s -H sh -c "kubectl-mcp-serve call get_pods '{\"namespace\":\"default\"}'" 2>&1)
          echo "$out"
          if ! echo "$out" | grep -qi 'success.*true' || ! echo "$out" | grep -q 'mcp-e2e-app'; then
            echo "kubectl-mcp-server did not find a healthy pod via get_pods"
            exit 1
          fi

          kubectl set image deployment/mcp-e2e-app nginx=nginx:this-tag-does-not-exist
          timeout 40 bash -c 'until kubectl get pods -l app=mcp-e2e-app -o jsonpath="{.items[*].status.containerStatuses[*].state.waiting.reason}" 2>/dev/null | grep -q "ErrImagePull\|ImagePullBackOff"; do sleep 2; done'
          broken_pod=$(kubectl get pods -l app=mcp-e2e-app -o json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          for p in d["items"]:
              for cs in p["status"].get("containerStatuses", []):
                  if cs.get("state", {}).get("waiting", {}).get("reason") in ("ErrImagePull", "ImagePullBackOff"):
                      print(p["metadata"]["name"])
                      sys.exit(0)
          ')

          out=$(kubectl exec deploy/podium -c podium -- sudo -u k8s -H sh -c "kubectl-mcp-serve call diagnose_pod_crash '{\"pod_name\":\"$broken_pod\",\"namespace\":\"default\"}'" 2>&1)
          echo "$out"
          if ! echo "$out" | grep -qi 'ErrImagePull\|ImagePullBackOff'; then
            echo "kubectl-mcp-server did not correctly diagnose a pod that failed to start"
            exit 1
          fi

          kubectl set image deployment/mcp-e2e-app nginx=nginx:alpine
          out=$(kubectl exec deploy/podium -c podium -- sudo -u k8s -H sh -c "kubectl-mcp-serve call scale_deployment '{\"name\":\"mcp-e2e-app\",\"replicas\":3,\"namespace\":\"default\"}'" 2>&1)
          echo "$out"
          if ! echo "$out" | grep -qi 'success.*true'; then
            echo "kubectl-mcp-server could not scale a deployment"
            exit 1
          fi

          out=$(kubectl exec deploy/podium -c podium -- sudo -u k8s -H sh -c "kubectl-mcp-serve call kubectl_explain '{\"resource\":\"deployment.spec.template.spec.containers.readinessProbe\"}'" 2>&1)
          echo "$out"
          if ! echo "$out" | grep -qi 'success.*true'; then
            echo "kubectl-mcp-server could not explain a resource field"
            exit 1
          fi

      - name: Verify the broadcast page serves
        run: |
          kubectl port-forward service/podium-broadcast 18088:1088 &
          echo $! > /tmp/pf.pid
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18088/)
          if [ "$code" != "200" ]; then
            echo "Expected HTTP 200 from the broadcast page, got $code"
            exit 1
          fi

      - name: Verify a live command reaches the websocket
        run: |
          cat > /tmp/requirements.txt <<'EOF'
          websocket-client==1.9.0 \
              --hash=sha256:af248a825037ef591efbf6ed20cc5faa03d3b47b9e5a2230a529eeee1c1fc3ef \
              --hash=sha256:9e813624b6eb619999a97dc7958469217c3176312b3a16a4bd1bc7e08a46ec98
          EOF
          python3 -m pip install --quiet --require-hashes --no-deps -r /tmp/requirements.txt
          python3 - <<'PYEOF'
          import subprocess, threading, time, sys
          import websocket

          marker = f"podium-e2e-marker-{int(time.time())}"
          received = threading.Event()

          def on_message(ws, message):
              if marker in message:
                  received.set()
                  ws.close()

          ws = websocket.WebSocketApp("ws://localhost:18088/", on_message=on_message)
          thread = threading.Thread(target=ws.run_forever, daemon=True)
          thread.start()

          time.sleep(2)
          subprocess.run(
              ["kubectl", "exec", "deploy/podium", "-c", "podium", "--",
               "sh", "-c", f"echo ': {int(time.time())}:0;{marker}' >> /home/k8s/.zsh_history"],
              check=True,
          )

          if not received.wait(timeout=20):
              print("Timed out waiting for the marker command to reach the broadcast websocket")
              sys.exit(1)

          print("Broadcast websocket delivered the live command as expected.")
          PYEOF

      - name: Show pod state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pod -l app.kubernetes.io/name=podium
          kubectl logs deploy/podium -c podium --tail=100 || true
          kubectl logs deploy/podium -c broadcast --tail=100 || true

      - name: Clean up port-forward
        if: always()
        run: kill "$(cat /tmp/pf.pid)" 2>/dev/null || true
