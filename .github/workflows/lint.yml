name: lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          # Fails only on hadolint's "error" severity; the remaining
          # warning/info findings are pre-existing style issues (mostly
          # inherited from shpod's own Dockerfile) not worth gating merges on.
          failure-threshold: error

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: error
          # These are sourced config fragments (zsh, in the podium user's
          # shell, or vim), not standalone POSIX/bash scripts, so shellcheck
          # can't correctly parse their dialect and flags a missing shebang.
          ignore_names: zshrc aliases motd vimrc
