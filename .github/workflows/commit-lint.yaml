name: commit-lint

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-lint:
    name: commit-lint
    runs-on: ubuntu-latest
    # Dependabot's own commit messages don't pass commitlint's stricter
    # subject-case/body-line-length rules (its PR titles do - pr-lint still
    # runs for these). A job skipped by its own "if" reports as passing for
    # required-status-check purposes, so this exempts Dependabot without
    # weakening the check for anyone else.
    if: github.actor != 'dependabot[bot]'
    steps:
      # pull_request_target checks out the base branch by default, not the
      # PR's commits, unless the ref is given explicitly - without this the
      # job silently lints the wrong commits.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@3d28780bbf0365e29b144e272b2121204d5be5f3 # v6
